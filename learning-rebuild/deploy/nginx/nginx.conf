# =============================================================================
# Nginx reverse proxy — satu pintu masuk untuk Platform Sekolah SMK Nagara.
# Akses via http://<ip-server>/  (LAN sekolah).
#   /            -> web  (Next.js, container "web":3000)
#   /api/*       -> api  (NestJS,  container "api":4000)
#   /uploads/*   -> api  (berkas statis: bukti izin, tugas)
# =============================================================================
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  keepalive_timeout  65;

  # Upload tugas hingga 10MB (lihat batas Multer di API). Beri margin → 12m.
  client_max_body_size 12m;

  # Kompresi aset teks.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml text/javascript;
  gzip_min_length 1024;

  # Upstream (nama service sesuai docker-compose).
  upstream lms_api {
    server api:4000;
  }
  upstream lms_web {
    server web:3000;
  }

  server {
    listen 80;
    server_name _;

    # Header keamanan dasar (Fase 9 — hardening ringan).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API ----
    location /api/ {
      proxy_pass         http://lms_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ---- Berkas terunggah (disajikan oleh API sebagai statis) ----
    location /uploads/ {
      proxy_pass         http://lms_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Web (Next.js) ----
    location / {
      proxy_pass         http://lms_web;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
