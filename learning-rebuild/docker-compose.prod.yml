# =============================================================================
# Docker Compose PRODUKSI — Platform Sekolah SMK Nagara (LMS + Absensi)
# Untuk PC server lokal sekolah (Windows + WSL2 + Docker Desktop).
# Stack: PostgreSQL + API (NestJS) + Web (Next.js) + Nginx. TANPA MinIO
# (berkas unggahan disimpan di volume disk lokal).
#
#   Jalankan : docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   Akses    : http://<ip-server>/    (port 80 via Nginx)
#
# Semua service restart: always → otomatis hidup lagi saat PC/Docker restart.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-lms_rebuild}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tidak publish port ke host → DB hanya diakses dari jaringan internal
    # compose. Untuk backup, gunakan `docker compose exec` (lihat skrip).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms_rebuild}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: lms-api:latest
    container_name: lms-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lms_rebuild}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      QR_SECRET: ${QR_SECRET:?QR_SECRET wajib diisi}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOADS_DIR: /data/uploads
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      MAIL_FROM: ${MAIL_FROM:-no-reply@smknagara.sch.id}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Kosong → web memakai path relatif '/api' via Nginx (disarankan).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: lms-web:latest
    container_name: lms-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: lms-nginx
    restart: always
    depends_on:
      - web
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: lms_postgres_data
  uploads_data:
    name: lms_uploads_data
